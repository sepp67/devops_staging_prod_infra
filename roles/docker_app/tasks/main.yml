---
# ─────────────────────────────────────────────────────────────────────────────
# docker_app — Déploie un conteneur applicatif simple via Docker Compose
#
# Reçoit la variable `project` avec les champs :
#   project_name, image, container_port, host_port,
#   healthcheck_url, environment (dict), volumes (list)
# ─────────────────────────────────────────────────────────────────────────────

- name: "{{ project.project_name }} | Create app directory"
  file:
    path: "{{ apps_base_dir }}/{{ project.project_name }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0750"

- name: "{{ project.project_name }} | Deploy docker-compose.yml"
  template:
    src: docker-compose.yml.j2
    dest: "{{ apps_base_dir }}/{{ project.project_name }}/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: "0640"
  notify: restart app

- name: "{{ project.project_name }} | Pull latest image"
  community.docker.docker_compose_v2:
    project_src: "{{ apps_base_dir }}/{{ project.project_name }}"
    pull: always
    state: present
  become_user: "{{ deploy_user }}"

- name: "{{ project.project_name }} | Wait for healthcheck"
  uri:
    url: "{{ project.healthcheck_url }}"
    status_code: 200
    return_content: false
  register: healthcheck
  until: healthcheck.status == 200
  retries: "{{ healthcheck_retries }}"
  delay: "{{ healthcheck_delay }}"
