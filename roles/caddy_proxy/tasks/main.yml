---
# ─────────────────────────────────────────────────────────────────────────────
# caddy_proxy — Installe Caddy et génère le Caddyfile depuis le registre projets
# ─────────────────────────────────────────────────────────────────────────────

- name: Install prerequisites
  apt:
    name:
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - curl
    state: present
    update_cache: true

- name: Add Caddy GPG key
  get_url:
    url: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    dest: /etc/apt/keyrings/caddy-stable.asc
    mode: "0644"
    force: false

- name: Add Caddy APT repository
  apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/caddy-stable.asc]
      https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main
    filename: caddy-stable
    state: present

- name: Install Caddy
  apt:
    name: caddy
    state: present
    update_cache: true

- name: Create Caddy directories
  file:
    path: "{{ item }}"
    state: directory
    owner: caddy
    group: caddy
    mode: "0750"
  loop:
    - "{{ caddy_config_dir }}"
    - "{{ caddy_data_dir }}"

- name: Create Caddy log directory
  file:
    path: "{{ caddy_log_dir }}"
    state: directory
    owner: caddy
    group: caddy
    mode: "0755"

- name: Create Caddy systemd override directory
  file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy Caddy systemd override (log path)
  copy:
    content: |
      [Service]
      LogsDirectory=caddy
    dest: /etc/systemd/system/caddy.service.d/logs.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart caddy

- name: Deploy Caddyfile
  template:
    src: Caddyfile.j2
    dest: "{{ caddy_caddyfile }}"
    owner: caddy
    group: caddy
    mode: "0640"
    validate: caddy validate --adapter caddyfile --config %s
  notify: reload caddy

- name: Enable and start Caddy
  systemd:
    name: caddy
    enabled: true
    state: started
