---
# ─────────────────────────────────────────────────────────────────────────────
# Variables communes — Staging
# Les secrets sont dans vault.yml (chiffré Ansible Vault).
# ─────────────────────────────────────────────────────────────────────────────

environment_name: staging
lavallee_domain: lavallee.local
facturier_domain: facturier.local
grav_docs_domain: docs.lavallee.local

# Utilisateur de déploiement créé sur chaque VM
deploy_user: devops

# Répertoire racine des applications sur les VMs
apps_base_dir: /opt

# ── Caddy ────────────────────────────────────────────────────────────────────
# En staging : pas de Let's Encrypt, certificats auto-signés Caddy (tls internal)
caddy_tls_mode: internal   # "internal" | "acme"
caddy_email: ""            # inutile en staging

# ── Registre de projets ───────────────────────────────────────────────────────
# Chemin local des fichiers projets (relatif au dépôt)
projects_vars_dir: "{{ playbook_dir }}/../vars/projects"

# Liste des fichiers projets à charger (sans extension).
# Ajouter une nouvelle app = ajouter son nom ici + créer vars/projects/<app>.yml
#
# Note sur "nextcloud" : ce projet est de type external_service (voir
# vars/projects/nextcloud.yml et README.md, section "Services externes").
# Il n'est JAMAIS déployé par deploy-apps.yml — il sert uniquement à
# déclarer le routage Caddy vers la VM Nextcloud, administrée manuellement.
#
# Note sur "webcam" : project_type docker_app classique, mais déployé sur
# une VM dédiée (groupe [webcam]), pas sur vm-apps-staging — voir
# webcam_backend_host ci-dessous et README.md, section "Services à VM dédiée".
active_projects:
  - lavallee-website
  - facturier-landing
  - facturier-app
  - grav-docs
  - nextcloud
  - webcam
  - matrix-users
  - matrix-users-federation
  - matrix-bridges
  - matrix-bridges-federation
  - element-web
  - keycloak

# ── Backends Caddy ────────────────────────────────────────────────────────────
# Adresse IP ou hostname de la VM qui héberge les apps.
# Caddy (sur vm-proxy) forward vers cette adresse + le host_port du projet.
backend_host: 192.168.1.58

# Adresse IP ou hostname de la VM Nextcloud (service externe, voir ci-dessus).
nextcloud_backend_host: 192.168.1.59

# ── Keycloak / IAM (service externe) ─────────────────────────────────────────
# Keycloak n'est PAS déployé par ce dépôt. Ces variables servent uniquement
# au routage Caddy (vars/projects/keycloak.yml) et à la configuration OIDC
# Synapse. Le service Keycloak est administré manuellement sur vm-keycloak-staging.
# Caddy expose https://keycloak.staging.local avec tls internal.
keycloak_domain: keycloak.staging.local
keycloak_backend_host: "192.168.1.76"  # TODO: remplacer par l'IP réelle de vm-keycloak-staging
keycloak_host_port: 8080

# ── Nextcloud (service externe — voir README.md) ──────────────────────────────
# Nextcloud n'est PAS déployé par ce dépôt. Ces deux variables ne servent
# qu'au routage Caddy (vars/projects/nextcloud.yml), pas à un déploiement.
# Toute variable de secret (admin, DB) a été retirée : ces secrets vivent
# uniquement dans le docker-compose.yml manuel sur vm-nextcloud-staging.
nextcloud_domain: cloud.lavallee.local
nextcloud_host_port: 8080

# ── Grav (grav-docs) ──────────────────────────────────────────────────────────
# Bootstrap admin optionnel (voir vars/projects/grav-docs.yml et le rôle
# grav_stack). Activé en staging : un compte admin est créé automatiquement
# au premier déploiement si aucun compte du même nom n'existe déjà.
# Secrets définis dans vault.yml (ansible-vault edit inventories/staging/group_vars/vault.yml)
grav_admin_user: "{{ vault_grav_admin_user }}"
grav_admin_password: "{{ vault_grav_admin_password }}"
grav_admin_email: "{{ vault_grav_admin_email }}"

# ── Webcam (VM dédiée, voir README.md) ────────────────────────────────────────
# Déployée par docker_app comme n'importe quelle app simple, mais sur sa
# propre VM (groupe [webcam]) plutôt que vm-apps-staging, car cette VM a une
# seconde interface réseau dédiée à la caméra physique (192.168.8.0/24).
# webcam_backend_host est l'IP LAN de cette VM (celle que Caddy doit joindre),
# distincte du réseau caméra.
webcam_domain: webcam.lavallee.local
webcam_backend_host: 192.168.1.15

# ── Matrix (routage Caddy uniquement) ─────────────────────────────────────────
# Ces variables ne servent qu'à router les requêtes vers les VMs Synapse.
# La configuration Synapse et PostgreSQL est gérée par le rôle autonome
# ansible-role-matrix-stack (dépôt séparé).
matrix_users_domain: matrix-users.local
matrix_users_backend_host: "192.168.1.78"
matrix_users_http_port: 8008

matrix_bridges_domain: matrix-bridges.local
matrix_bridges_backend_host: "192.168.1.77"
matrix_bridges_http_port: 8009

# Configuration Synapse — ansible-role-matrix-stack
matrix_users_server_name: "{{ matrix_users_domain }}"
matrix_users_public_baseurl: "https://{{ matrix_users_domain }}/"

matrix_bridges_server_name: "{{ matrix_bridges_domain }}"
matrix_bridges_public_baseurl: "https://{{ matrix_bridges_domain }}/"

# ── Matrix — Fédération interne (staging) ─────────────────────────────────────
# DNS : les conteneurs Synapse doivent résoudre les noms de domaine Matrix vers
# le proxy Caddy (192.168.1.56), pas vers les VMs Synapse elles-mêmes.
# Sans cela, la fédération crée une boucle ou échoue avec une erreur SSL.
# Note : les clés de ce dict sont des chaînes statiques — Ansible n'évalue pas
# les expressions Jinja2 dans les clés de mapping YAML.
matrix_extra_hosts:
  "matrix-users.local": "192.168.1.56"
  "matrix-bridges.local": "192.168.1.56"
  # Synapse doit joindre Keycloak via le proxy Caddy (pas directement vers la VM
  # Keycloak) pour que le certificat tls internal Caddy soit valide.
  "keycloak.local": "192.168.1.76"

# Synapse refuse par défaut les connexions fédération vers des IPs RFC1918.
# En staging avec un proxy interne, toutes les connexions passent par 192.168.1.56.
matrix_synapse_ip_range_whitelist:
  - "192.168.1.0/24"

# ── Matrix — CA Caddy (staging uniquement) ────────────────────────────────────
# Chemin du certificat CA écrit par le rôle caddy_ca sur chaque VM Synapse.
# Le rôle Matrix monte ce fichier dans le conteneur et utilise l'entrypoint
# dédié pour l'installer dans le trust store avant le démarrage de Synapse.
# En production (ACME), laisser à "" : Let's Encrypt est reconnu par défaut.
matrix_ca_cert_path: "/opt/caddy-ca/caddy-root.crt"


# ── Element Web ───────────────────────────────────────────────────────────────
# Le client web Matrix Element est déployé par le rôle element_web via
# playbooks/deploy-apps.yml (play "Deploy Element Web client").
# Ce fichier concentre toutes ses variables : routage Caddy (element_web_*)
# et configuration du rôle (element_*).

# Routage Caddy (vars/projects/element-web.yml)
element_web_domain: element.lavallee.local
element_web_backend_host: "192.168.1.80"  # TODO: remplacer par l'IP réelle
element_web_http_port: 8080

# Configuration du rôle element_web
element_default_homeserver_url: "https://matrix-users.local"
element_default_homeserver_name: "matrix-users.local"
element_disable_custom_urls: false
element_disable_guests: true
element_brand: "ARN / Lavallee Matrix"
element_http_port: 8080

# ── Matrix — OIDC / Keycloak ──────────────────────────────────────────────────
# Synapse délègue l'authentification à Keycloak via OIDC.
# L'issuer pointe vers Caddy (tls internal), pas directement vers la VM Keycloak.
# Pré-requis : keycloak.staging.local résolu → 192.168.1.56 (proxy Caddy) dans
# matrix_extra_hosts, et la CA Caddy installée dans le trust store du conteneur
# via l'entrypoint wrapper (rôle matrix_stack, matrix_ca_cert_path non vide).
# Le secret est dans vault.yml : vault_matrix_oidc_client_secret.
matrix_oidc_enabled: true
matrix_oidc_issuer: "https://{{ keycloak_domain }}/realms/lavallee"
matrix_oidc_client_id: synapse
matrix_oidc_client_secret: "{{ vault_matrix_oidc_client_secret }}"
