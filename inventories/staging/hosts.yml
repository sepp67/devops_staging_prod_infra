---
all:
  children:

    proxy:
      hosts:
        vm-proxy-staging:
          ansible_host: 192.168.1.56

    apps:
      hosts:
        vm-apps-staging:
          ansible_host: 192.168.1.58

    nextcloud:
      hosts:
        vm-nextcloud-staging:
          ansible_host: 192.168.1.59

    # VM dédiée, hors du groupe [apps] générique : contrainte réseau
    # spécifique (seconde interface sur le réseau caméra 192.168.8.0/24
    # pour atteindre la caméra physique en RTSP). Voir README.md.
    webcam:
      hosts:
        vm-camera-claude:
          ansible_host: 192.168.1.15

    # ── Matrix ────────────────────────────────────────────────────────────────
    # Trois VMs dédiées référencées pour la documentation de l'infrastructure.
    # Le déploiement Synapse + PostgreSQL est géré par le rôle autonome
    # ansible-role-matrix-stack (dépôt séparé). Ce dépôt gère uniquement
    # le routage Caddy (vars/projects/matrix-*.yml).
    matrix_users:
      hosts:
        vm-matrix-users-staging:
          ansible_host: 192.168.1.78

    matrix_bridges:
      hosts:
        vm-matrix-bridges-staging:
          ansible_host: 192.168.1.77

    matrix_db:
      hosts:
        vm-matrix-db-staging:
          ansible_host: 192.168.1.79

    matrix:
      children:
        matrix_users:
        matrix_bridges:
        matrix_db:
