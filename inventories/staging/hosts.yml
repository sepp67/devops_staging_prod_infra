---
all:
  children:

    proxy:
      hosts:
        vm-proxy-staging:
          ansible_host: 192.168.1.56

    apps:
      hosts:
        vm-apps-staging:
          ansible_host: 192.168.1.58

    nextcloud:
      hosts:
        vm-nextcloud-staging:
          ansible_host: 192.168.1.59

    # VM dédiée, hors du groupe [apps] générique : contrainte réseau
    # spécifique (seconde interface sur le réseau caméra 192.168.8.0/24
    # pour atteindre la caméra physique en RTSP). Voir README.md.
    webcam:
      hosts:
        vm-camera-claude:
          ansible_host: 192.168.1.15

    # ── Element Web ───────────────────────────────────────────────────────────
    # Client web Matrix. Déployé par le rôle element_web via deploy-apps.yml.
    # Routage Caddy déclaré dans vars/projects/element-web.yml.
    element_web:
      hosts:
        vm-element-web-staging:
          ansible_host: 192.168.1.80

    # ── Matrix ────────────────────────────────────────────────────────────────
    # Trois VMs dédiées pour PostgreSQL + Synapse. Le déploiement est orchestré
    # par le rôle matrix_stack via deploy-apps.yml (plays 2, 3, 4).
    # Routage Caddy déclaré dans vars/projects/matrix-*.yml.
    matrix_users:
      hosts:
        vm-matrix-users-staging:
          ansible_host: 192.168.1.78

    matrix_bridges:
      hosts:
        vm-matrix-bridges-staging:
          ansible_host: 192.168.1.77

    matrix_db:
      hosts:
        vm-matrix-db-staging:
          ansible_host: 192.168.1.79

    # ── Keycloak / IAM ────────────────────────────────────────────────────────
    # Service IAM externe. Administré manuellement sur cette VM.
    # Routage Caddy déclaré dans vars/projects/keycloak.yml.
    # Non déployé par ce dépôt (project_type: external_service).
    iam:
      hosts:
        vm-keycloak-staging:
          ansible_host: 192.168.1.76  

    matrix:
      children:
        matrix_users:
        matrix_bridges:
        matrix_db:
