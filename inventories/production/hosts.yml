---
all:
  children:

    proxy:
      hosts:
        # TODO : remplacer par l'IP réelle de la VM proxy de production
        vm-proxy-prod:
          ansible_host: 192.168.1.69

    apps:
      hosts:
        # TODO : remplacer par l'IP réelle de la VM apps de production
        vm-apps-prod:
          ansible_host: 192.168.1.70

    nextcloud:
      hosts:
        # TODO : remplacer par l'IP réelle de la VM Nextcloud de production
        vm-nextcloud-prod:
          ansible_host: 192.168.1.71

    # VM dédiée, hors du groupe [apps] générique : contrainte réseau
    # spécifique (seconde interface sur le réseau caméra pour atteindre la
    # caméra physique en RTSP, exactement comme en staging). Voir README.md.
    # TODO : remplacer par l'IP LAN réelle de la VM caméra de production.
    webcam:
      hosts:
        vm-camera-prod:
          ansible_host: 192.168.1.73

    # ── Element Web ───────────────────────────────────────────────────────────
    # Client web Matrix. Déployé par le rôle element_web via deploy-apps.yml.
    # Routage Caddy déclaré dans vars/projects/element-web.yml.
    element_web:
      hosts:
        vm-element-web:
          ansible_host: 192.168.1.84

    # ── Matrix ────────────────────────────────────────────────────────────────
    # Trois VMs dédiées pour PostgreSQL + Synapse. Le déploiement est orchestré
    # par le rôle matrix_stack via deploy-apps.yml (plays 2, 3, 4).
    # Routage Caddy déclaré dans vars/projects/matrix-*.yml.
    matrix_users:
      hosts:
        vm-matrix-users:
          ansible_host: 192.168.1.81

    matrix_bridges:
      hosts:
        vm-matrix-bridges:
          ansible_host: 192.168.1.82

    matrix_db:
      hosts:
        vm-matrix-db:
          ansible_host: 192.168.1.83

    # ── Keycloak / IAM ────────────────────────────────────────────────────────
    # Service IAM externe. Administré manuellement sur cette VM.
    # Routage Caddy déclaré dans vars/projects/keycloak.yml.
    # Non déployé par ce dépôt (project_type: external_service).
    # TODO : remplacer par l'IP réelle de la VM Keycloak de production.
    iam:
      hosts:
        vm-keycloak-prod:
          ansible_host: 192.168.1.85

    matrix:
      children:
        matrix_users:
        matrix_bridges:
        matrix_db:
