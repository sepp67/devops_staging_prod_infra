---
# ─────────────────────────────────────────────────────────────────────────────
# Variables communes — Production
# Les secrets sont dans vault.yml (chiffré Ansible Vault).
# ─────────────────────────────────────────────────────────────────────────────

environment_name: production
lavallee_domain: lavallee.tech
facturier_domain: facturier.lavallee.tech
grav_docs_domain: docs.lavallee.tech

deploy_user: deploy
apps_base_dir: /opt

# ── Caddy ────────────────────────────────────────────────────────────────────
# En production : Let's Encrypt via ACME
caddy_tls_mode: acme
caddy_email: admin@lavallee.tech

# ── Registre de projets ───────────────────────────────────────────────────────
projects_vars_dir: "{{ playbook_dir }}/../vars/projects"

# Note sur "nextcloud" : voir le commentaire équivalent dans
# inventories/staging/group_vars/all/main.yml — project_type: external_service,
# jamais déployé par deploy-apps.yml.
#
# Note sur "webcam" : project_type docker_app classique, mais déployé sur
# une VM dédiée (groupe [webcam]), pas sur vm-apps-prod — voir
# webcam_backend_host ci-dessous et README.md, section "Services à VM dédiée".
active_projects:
  - lavallee-website
  - facturier-landing
  - facturier-app
  # - grav-docs
  - nextcloud
  - webcam
  - matrix-users
  - matrix-users-federation
  - matrix-bridges
  - matrix-bridges-federation
  - element-web
  - keycloak

# ── Backends Caddy ────────────────────────────────────────────────────────────
# TODO : remplacer par l'IP réelle de vm-apps-prod (doit correspondre à
# inventories/production/hosts.yml).
backend_host: 192.168.1.70

# Adresse IP ou hostname de la VM Nextcloud (service externe, voir ci-dessus).
# TODO : remplacer par l'IP réelle de vm-nextcloud-prod.
nextcloud_backend_host: 192.168.1.71

# ── Nextcloud (service externe — voir README.md) ──────────────────────────────
# Nextcloud n'est PAS déployé par ce dépôt. Ces deux variables ne servent
# qu'au routage Caddy (vars/projects/nextcloud.yml), pas à un déploiement.
nextcloud_domain: cloud.lavallee.tech
nextcloud_host_port: 8080

# ── Keycloak / IAM (service externe) ─────────────────────────────────────────
# Keycloak n'est PAS déployé par ce dépôt. Ces variables servent uniquement
# au routage Caddy (vars/projects/keycloak.yml). Keycloak est administré
# manuellement sur vm-keycloak-prod.
# Intégration OIDC Synapse activée — voir bloc "Matrix — OIDC / Keycloak"
# ci-dessous (matrix_oidc_enabled).
keycloak_domain: keycloak.lavallee.tech
# TODO : remplacer par l'IP réelle de vm-keycloak-prod (doit correspondre
# à inventories/production/hosts.yml).
keycloak_backend_host: "192.168.1.85"
keycloak_host_port: 8080

# ── Grav (grav-docs) ──────────────────────────────────────────────────────────
# Bootstrap admin optionnel (voir vars/projects/grav-docs.yml et le rôle
# grav_stack). Activé en production, comme en staging : un compte admin est
# créé automatiquement au premier déploiement si aucun compte du même nom
# n'existe déjà. Secrets définis dans vault.yml
# (ansible-vault edit inventories/production/group_vars/all/vault.yml)
grav_admin_user: "{{ vault_grav_admin_user }}"
grav_admin_password: "{{ vault_grav_admin_password }}"
grav_admin_email: "{{ vault_grav_admin_email }}"

# ── Webcam (VM dédiée, voir README.md) ────────────────────────────────────────
# Activé en production, comme en staging. Déployée par docker_app comme
# n'importe quelle app simple, mais sur sa propre VM (groupe [webcam])
# plutôt que vm-apps-prod, car cette VM a une seconde interface réseau
# dédiée à la caméra physique. webcam_backend_host est l'IP LAN de cette
# VM (celle que Caddy doit joindre), distincte du réseau caméra.
# Secret RTSP défini dans vault.yml
# (ansible-vault edit inventories/production/group_vars/all/vault.yml)
webcam_domain: webcam.lavallee.tech
# TODO : remplacer par l'IP LAN réelle de vm-camera-prod (doit correspondre
# à inventories/production/hosts.yml).
webcam_backend_host: 192.168.1.73

# ── Matrix (routage Caddy uniquement) ─────────────────────────────────────────
# Ces variables ne servent qu'à router les requêtes vers les VMs Synapse.
# La configuration Synapse et PostgreSQL est gérée par le rôle autonome
# ansible-role-matrix-stack (dépôt séparé).
matrix_users_domain: matrix-users.lavallee.tech
matrix_users_backend_host: "192.168.1.81"
matrix_users_http_port: 8008

matrix_bridges_domain: matrix-bridges.lavallee.tech
matrix_bridges_backend_host: "192.168.1.82"
matrix_bridges_http_port: 8009

# IP de vm-matrix-db (PostgreSQL) — joignable depuis les VMs Synapse
matrix_postgres_host: "192.168.1.83"
matrix_postgres_port: 5432

# Configuration Synapse — ansible-role-matrix-stack
matrix_users_server_name: "{{ matrix_users_domain }}"
matrix_users_public_baseurl: "https://{{ matrix_users_domain }}/"

matrix_bridges_server_name: "{{ matrix_bridges_domain }}"
matrix_bridges_public_baseurl: "https://{{ matrix_bridges_domain }}/"

# ── Matrix — OIDC / Keycloak ──────────────────────────────────────────────────
# Synapse délègue l'authentification à Keycloak via OIDC.
# Pré-requis externe (Keycloak, administré manuellement) : un realm "lavallee"
# avec un client confidentiel "synapse" dont le secret correspond à
# vault_matrix_oidc_client_secret, et une redirect URI
# https://matrix-users.lavallee.tech/_synapse/client/oidc/callback.
matrix_oidc_enabled: true
matrix_oidc_issuer: "https://{{ keycloak_domain }}/realms/lavallee"
matrix_oidc_client_id: synapse
matrix_oidc_client_secret: "{{ vault_matrix_oidc_client_secret }}"

# ── Matrix — Secrets (références vault) ───────────────────────────────────────
matrix_postgres_superuser_password: "{{ vault_matrix_postgres_superuser_password }}"
matrix_postgres_password_users: "{{ vault_matrix_postgres_password_users }}"
matrix_postgres_password_bridges: "{{ vault_matrix_postgres_password_bridges }}"
matrix_users_registration_shared_secret: "{{ vault_matrix_users_registration_shared_secret }}"
matrix_users_macaroon_secret_key: "{{ vault_matrix_users_macaroon_secret_key }}"
matrix_users_form_secret: "{{ vault_matrix_users_form_secret }}"
matrix_bridges_registration_shared_secret: "{{ vault_matrix_bridges_registration_shared_secret }}"
matrix_bridges_macaroon_secret_key: "{{ vault_matrix_bridges_macaroon_secret_key }}"
matrix_bridges_form_secret: "{{ vault_matrix_bridges_form_secret }}"

# ── Matrix — PostgreSQL — bases génériques ────────────────────────────────────
# Toutes les bases PostgreSQL de la stack Matrix, y compris les bridges. Le
# rôle ne connaît aucune de ces bases par son nom : ajouter un composant
# Matrix qui a besoin de PostgreSQL consiste à ajouter une entrée ici.
# Consommé par le play "Deploy Matrix PostgreSQL" (matrix_component: postgres)
# de deploy-apps.yml.
matrix_postgresql_databases:
  - name: synapse_users
    user: synapse_users
    password: "{{ vault_matrix_postgres_password_users }}"

  - name: synapse_bridges
    user: synapse_bridges
    password: "{{ vault_matrix_postgres_password_bridges }}"

  - name: mautrix_whatsapp
    user: mautrix_whatsapp
    password: "{{ vault_matrix_bridge_whatsapp_db_password }}"

  - name: mautrix_telegram
    user: mautrix_telegram
    password: "{{ vault_matrix_bridge_telegram_db_password }}"

  - name: mautrix_signal
    user: mautrix_signal
    password: "{{ vault_matrix_bridge_signal_db_password }}"

# ── Matrix — Fédération (production) ──────────────────────────────────────────
# DNS : les conteneurs Synapse doivent résoudre les noms de domaine Matrix vers
# le proxy Caddy, pas vers les VMs Synapse elles-mêmes.
# Note : les clés de ce dict sont des chaînes statiques — Ansible n'évalue pas
# les expressions Jinja2 dans les clés de mapping YAML.
matrix_extra_hosts:
  "matrix-users.lavallee.tech": "192.168.1.69"
  "matrix-bridges.lavallee.tech": "192.168.1.69"
  # Synapse doit joindre Keycloak via le proxy Caddy (pas directement vers la VM
  # Keycloak) — même principe que les deux entrées ci-dessus.
  "keycloak.lavallee.tech": "192.168.1.69"

# En production avec ACME (Let's Encrypt), pas besoin de whitelist RFC1918
# sauf si le proxy est interne. À ajuster si le proxy prod est exposé publiquement.
matrix_synapse_ip_range_whitelist:
  - "192.168.1.0/24"

# ── Matrix — CA Caddy ─────────────────────────────────────────────────────────
# En production (ACME), Let's Encrypt est reconnu par défaut.
# Laisser à "" sauf si le proxy utilise des certificats auto-signés.
matrix_ca_cert_path: ""

# ── Matrix — Bridges (mautrix-whatsapp / mautrix-telegram / mautrix-signal) ──
# Déployés par le rôle matrix_stack (matrix_component: bridges) sur le groupe
# matrix_bridges, après Synapse Bridges — voir play "Deploy Matrix bridges"
# de deploy-apps.yml. Chaque bridge a sa base PostgreSQL dédiée déclarée
# ci-dessus dans matrix_postgresql_databases.
matrix_bridges_enabled: true
matrix_synapse_internal_url: "http://192.168.1.82:{{ matrix_bridges_http_port }}"
matrix_appservice_base_url: "http://192.168.1.82"
# Permissions par défaut : deny-all (héritage du rôle), sauf les comptes
# matrix-users.lavallee.tech qui peuvent utiliser les bridges.
# Note : comme pour matrix_extra_hosts, les clés de ce dict sont des chaînes
# statiques — Ansible n'évalue pas les expressions Jinja2 dans les clés de
# mapping YAML, donc pas de "{{ matrix_users_domain }}" ici.
matrix_bridges_default_permissions:
  "*": ""
  "matrix-users.lavallee.tech": "user"

matrix_bridges:
  - name: whatsapp
    image: dock.mau.dev/mautrix/whatsapp
    tag: latest
    container_name: mautrix-whatsapp
    appservice_id: whatsapp
    appservice_port: 29317
    bot_username: whatsappbot
    database_name: mautrix_whatsapp
    database_user: mautrix_whatsapp
    database_password: "{{ vault_matrix_bridge_whatsapp_db_password }}"

  - name: telegram
    image: dock.mau.dev/mautrix/telegram
    tag: latest
    container_name: mautrix-telegram
    appservice_id: telegram
    appservice_port: 29318
    bot_username: telegrambot
    database_name: mautrix_telegram
    database_user: mautrix_telegram
    database_password: "{{ vault_matrix_bridge_telegram_db_password }}"
    # api_id/api_hash sont obligatoires pour mautrix-telegram (my.telegram.org).
    # Même application Telegram qu'en staging (partagée entre les deux environnements).
    # Clé "network" (pas "telegram") : l'image dock.mau.dev/mautrix/telegram:latest
    # est la réécriture Go (bridgev2), dont le schéma attend api_id/api_hash
    # sous network:, pas sous un top-level telegram: (ancien bridge Python).
    extra_config:
      network:
        # api_id doit être un entier YAML non quoté (struct Go: APIID int) —
        # le filtre | int force le type natif, quel que soit le typage du
        # vault. api_hash est un string côté Go, pas besoin de cast.
        api_id: "{{ vault_matrix_telegram_api_id | int }}"
        api_hash: "{{ vault_matrix_telegram_api_hash }}"

  - name: signal
    image: dock.mau.dev/mautrix/signal
    tag: latest
    container_name: mautrix-signal
    appservice_id: signal
    appservice_port: 29319
    bot_username: signalbot
    database_name: mautrix_signal
    database_user: mautrix_signal
    database_password: "{{ vault_matrix_bridge_signal_db_password }}"

# ── Element Web ───────────────────────────────────────────────────────────────
# Routage Caddy (vars/projects/element-web.yml)
element_web_domain: element.lavallee.tech
element_web_backend_host: "192.168.1.84"
element_web_http_port: 8080

# Configuration du rôle element_web
element_default_homeserver_url: "https://matrix-users.lavallee.tech"
element_default_homeserver_name: "matrix-users.lavallee.tech"
element_disable_custom_urls: false
element_disable_guests: true
element_brand: "ARN / Lavallee Matrix"
element_http_port: 8080
