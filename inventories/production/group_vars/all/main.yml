---
# ─────────────────────────────────────────────────────────────────────────────
# Variables communes — Production
# Les secrets sont dans vault.yml (chiffré Ansible Vault).
# ─────────────────────────────────────────────────────────────────────────────

environment_name: production
lavallee_domain: lavallee.tech
facturier_domain: facturier.lavallee.tech
grav_docs_domain: docs.lavallee.tech

deploy_user: deploy
apps_base_dir: /opt

# ── Caddy ────────────────────────────────────────────────────────────────────
# En production : Let's Encrypt via ACME
caddy_tls_mode: acme
caddy_email: admin@lavallee.tech

# ── Registre de projets ───────────────────────────────────────────────────────
projects_vars_dir: "{{ playbook_dir }}/../vars/projects"

# Note sur "nextcloud" : voir le commentaire équivalent dans
# inventories/staging/group_vars/all/main.yml — project_type: external_service,
# jamais déployé par deploy-apps.yml.
#
# Note sur "webcam" : project_type docker_app classique, mais déployé sur
# une VM dédiée (groupe [webcam]), pas sur vm-apps-prod — voir
# webcam_backend_host ci-dessous et README.md, section "Services à VM dédiée".
active_projects:
  - lavallee-website
  - facturier-landing
  - facturier-app
  - grav-docs
  - nextcloud
  - webcam

# ── Backends Caddy ────────────────────────────────────────────────────────────
# TODO : remplacer par l'IP réelle de vm-apps-prod (doit correspondre à
# inventories/production/hosts.yml).
backend_host: TODO_SET_REAL_IP

# Adresse IP ou hostname de la VM Nextcloud (service externe, voir ci-dessus).
# TODO : remplacer par l'IP réelle de vm-nextcloud-prod.
nextcloud_backend_host: TODO_SET_REAL_IP

# ── Nextcloud (service externe — voir README.md) ──────────────────────────────
# Nextcloud n'est PAS déployé par ce dépôt. Ces deux variables ne servent
# qu'au routage Caddy (vars/projects/nextcloud.yml), pas à un déploiement.
nextcloud_domain: nextcloud.lavallee.tech
nextcloud_host_port: 8080

# ── Grav (grav-docs) ──────────────────────────────────────────────────────────
# Bootstrap admin optionnel (voir vars/projects/grav-docs.yml et le rôle
# grav_stack). Activé en production, comme en staging : un compte admin est
# créé automatiquement au premier déploiement si aucun compte du même nom
# n'existe déjà. Secrets définis dans vault.yml
# (ansible-vault edit inventories/production/group_vars/all/vault.yml)
grav_admin_user: "{{ vault_grav_admin_user }}"
grav_admin_password: "{{ vault_grav_admin_password }}"
grav_admin_email: "{{ vault_grav_admin_email }}"

# ── Webcam (VM dédiée, voir README.md) ────────────────────────────────────────
# Activé en production, comme en staging. Déployée par docker_app comme
# n'importe quelle app simple, mais sur sa propre VM (groupe [webcam])
# plutôt que vm-apps-prod, car cette VM a une seconde interface réseau
# dédiée à la caméra physique. webcam_backend_host est l'IP LAN de cette
# VM (celle que Caddy doit joindre), distincte du réseau caméra.
# Secret RTSP défini dans vault.yml
# (ansible-vault edit inventories/production/group_vars/all/vault.yml)
webcam_domain: webcam.lavallee.tech
# TODO : remplacer par l'IP LAN réelle de vm-camera-prod (doit correspondre
# à inventories/production/hosts.yml).
webcam_backend_host: TODO_SET_REAL_IP
