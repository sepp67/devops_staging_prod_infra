---
# ─────────────────────────────────────────────────────────────────────────────
# Projet : matrix-users
# Homeserver Synapse dédié aux utilisateurs Matrix.
# project_type: external_service — ce fichier déclare uniquement le routage
# Caddy vers la VM Synapse Users. Le déploiement est orchestré par le rôle
# matrix_stack via playbooks/deploy-apps.yml (play "Deploy Matrix Synapse –
# Users homeserver").
# ─────────────────────────────────────────────────────────────────────────────
project_name: matrix-users
project_type: external_service
domain: "{{ matrix_users_domain }}"
route_path: /
host_port: "{{ matrix_users_http_port }}"
backend_host: "{{ matrix_users_backend_host }}"
