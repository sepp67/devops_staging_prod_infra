---
# ─────────────────────────────────────────────────────────────────────────────
# Projet : matrix-users-federation
# Route Caddy dédiée à la fédération Matrix sur le port 8448.
#
# La fédération Matrix utilise par défaut le port 8448 (SRV DNS ou port
# standard). Caddy doit exposer ce port avec TLS et router vers le port HTTP
# 8008 de la VM Synapse Users.
#
# Pourquoi un fichier séparé : le port d'écoute diffère du bloc :443 standard.
# Le Caddyfile groupe par (domain, listen_port), ce qui génère deux blocs
# distincts pour matrix-users.local.
# ─────────────────────────────────────────────────────────────────────────────
project_name: matrix-users-federation
project_type: external_service
domain: "{{ matrix_users_domain }}"
listen_port: 8448
route_path: /
host_port: "{{ matrix_users_http_port }}"
backend_host: "{{ matrix_users_backend_host }}"
