---
# ─────────────────────────────────────────────────────────────────────────────
# Projet : matrix-bridges
# Homeserver Synapse dédié aux bridges Mautrix (WhatsApp, Signal, etc.).
# project_type: external_service — ce fichier déclare uniquement le routage
# Caddy vers la VM Synapse Bridges. Le déploiement est orchestré par le rôle
# matrix_stack via playbooks/deploy-apps.yml (play "Deploy Matrix Synapse –
# Bridges homeserver"). Les bridges Mautrix eux-mêmes ne sont pas encore
# installés à cette étape.
# ─────────────────────────────────────────────────────────────────────────────
project_name: matrix-bridges
project_type: external_service
domain: "{{ matrix_bridges_domain }}"
route_path: /
host_port: "{{ matrix_bridges_http_port }}"
backend_host: "{{ matrix_bridges_backend_host }}"
